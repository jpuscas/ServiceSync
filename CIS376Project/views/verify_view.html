<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Account</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4e73df, #1cc88a);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .verify-box {
            background: white;
            padding: 40px;
            width: 350px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 32px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4e73df;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button:hover {
            background: #2e59d9;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 10px;
        }

        .success {
            color: green;
            text-align: center;
            margin-bottom: 10px;
        }

        .company-header {
            text-align: center;
            margin-bottom: 80px;
            color: white;
            font-size: 75px;
            font-weight: bold;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #4e73df;
            text-decoration: none;
        }
    </style>
</head>

<body>
<div class="company-header">Service Scheduler</div>

<div class="verify-box">
    <h2>Verify Account</h2>

    {% if token %}
        <p style="text-align: center; color: #4e73df; font-weight: bold;">For demo purposes, your verification token is: {{ token }}</p>
    {% else %}
        <p style="text-align: center; color: #666;">Please check your email for the verification token.</p>
    {% endif %}

    {% if message %}
        <div class="{% if 'successfully' in message.lower() %}success{% else %}error{% endif %}">{{ message }}</div>
    {% endif %}

    <form method="POST" action="/verify">
        <input type="text" name="token" placeholder="Verification Token" required>
        <button type="submit">Verify</button>
    </form>

    <div class="back-link">
        <a href="/login">Back to Login</a>
    </div>
</div>

</body>
</html>
