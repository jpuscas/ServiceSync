<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4e73df, #1cc88a);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            padding: 40px;
            width: 350px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 32px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4e73df;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button:hover {
            background: #2e59d9;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 10px;
        }

        .company-header {
            text-align: center;
            margin-bottom: 80px;
            color: white;
            font-size: 75px;
            font-weight: bold;
        }

        .quick-links {
            margin-top: 18px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .quick-links a {
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.12);
        }

        .quick-links a:hover {
            background: rgba(255,255,255,0.2);
        }

        .password-wrapper {
            position: relative;
            margin-bottom: 15px;
        }

        .password-wrapper input {
            margin-bottom: 0;
            padding-right: 44px;
        }

        .btn-show-password {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: auto;
            padding: 4px 6px;
            background: transparent;
            color: #555;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            line-height: 1;
        }

        .btn-show-password:hover {
            background: transparent;
            color: #222;
        }
    </style>
</head>

<body>
<div class="company-header">Service Scheduler</div>


<div class="login-box">
    <h2>Login</h2>

    <!-- Error message placeholder -->
    {% if message %}
        <div class="error">{{ message }}</div>
    {% endif %}

    <form method="POST" action="/login">
        <input type="text" name="username" placeholder="Username" required autocomplete="off">
        <div class="password-wrapper">
            <input type="password" id="login-password" name="password" placeholder="Password" required>
            <button type="button" class="btn-show-password" onclick="toggleLoginPassword()" title="Show/hide password">👁</button>
        </div>
        <button type="submit">Login</button>
    </form>

    <p style="text-align: center; margin-top: 15px;">
        Don't have an account? <a href="/register" style="color: #4e73df; text-decoration: none;">Sign up</a>
    </p>

</div>

<div class="quick-links">
    <a href="/">Home</a>
    <a href="/services">Services</a>
    <a href="/services/new">Create Service</a>
    <a href="/songs">Songs</a>
</div>

<script>
    function toggleLoginPassword() {
        const input = document.getElementById('login-password');
        const btn = input.nextElementSibling;
        if (input.type === 'password') {
            input.type = 'text';
            btn.textContent = '🙈';
            btn.title = 'Hide password';
        } else {
            input.type = 'password';
            btn.textContent = '👁';
            btn.title = 'Show password';
        }
    }
</script>

</body>
</html>
